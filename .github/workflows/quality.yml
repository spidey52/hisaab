name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - name: Install and typecheck
        working-directory: backend
        run: |
          bun install --frozen-lockfile
          bun run typecheck

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - name: Install, typecheck, and build
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build

  mobile-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Verify release API guard
        run: |
          encoded="$(printf '%s' 'HISAAB_API_URL=https://api.example.com' | base64 -w 0)"
          CONFIGURATION=Release DART_DEFINES="$encoded" /bin/sh tool/verify_release_api.sh
          invalid="$(printf '%s' 'HISAAB_API_URL=https://private.example.ts.net' | base64 -w 0)"
          if CONFIGURATION=Release DART_DEFINES="$invalid" /bin/sh tool/verify_release_api.sh; then
            echo "Private release URL was unexpectedly accepted." >&2
            exit 1
          fi
      - run: flutter build apk --debug --dart-define=HISAAB_API_URL=https://api.example.com

  mobile-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ios --simulator --debug --dart-define=HISAAB_API_URL=https://api.example.com
